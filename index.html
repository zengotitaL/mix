<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132a45">
  <title>Classroom Music</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px;
      background: radial-gradient(circle at top, #2b6cb0 0, #132a45 48%, #08111f 100%);
      color: #fff;
    }
    main {
      width: min(720px, 100%); padding: clamp(28px, 7vw, 64px); text-align: center;
      background: rgba(8, 17, 31, .78); border: 2px solid rgba(255,255,255,.18);
      border-radius: 32px; box-shadow: 0 24px 70px rgba(0,0,0,.38);
    }
    .music-note { font-size: clamp(64px, 15vw, 110px); line-height: 1; margin-bottom: 18px; }
    h1 { margin: 0; font-size: clamp(34px, 8vw, 60px); }
    #status { min-height: 32px; margin: 18px 0 34px; color: #cfe8ff; font-size: 22px; font-weight: 700; }
    .buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    button {
      min-height: 92px; border: 0; border-radius: 20px; padding: 14px 10px;
      font: inherit; font-size: clamp(20px, 4vw, 28px); font-weight: 800; color: #07111f;
      cursor: pointer; box-shadow: 0 7px 0 rgba(0,0,0,.3); touch-action: manipulation;
    }
    button:active { transform: translateY(5px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }
    button:focus-visible { outline: 5px solid #fff; outline-offset: 4px; }
    #play { background: #75e6a4; }
    #pause { background: #ffd166; }
    #skip { background: #79c8ff; }
    @media (max-width: 560px) {
      .buttons { grid-template-columns: 1fr; }
      button { min-height: 76px; }
    }
  </style>
</head>
<body>
  <main>
    <div class="music-note" aria-hidden="true">♫</div>
    <h1>Classroom Music</h1>
    <div id="status" role="status" aria-live="polite">Press Play to begin</div>
    <div class="buttons">
      <button id="play" type="button" aria-label="Play music">▶ Play</button>
      <button id="pause" type="button" aria-label="Pause music">⏸ Pause</button>
      <button id="skip" type="button" aria-label="Skip to another song">⏭ Skip</button>
    </div>
    <audio id="player" preload="metadata"></audio>
  </main>

  <script src="songs.js"></script>
  <script>
    "use strict";

    const audio = document.getElementById("player");
    const statusText = document.getElementById("status");
    const playButton = document.getElementById("play");
    const pauseButton = document.getElementById("pause");
    const skipButton = document.getElementById("skip");

    let queue = [];
    let queuePosition = 0;
    let songLoaded = false;

    function shuffle(items) {
      const copy = [...items];
      for (let i = copy.length - 1; i > 0; i--) {
        const random = new Uint32Array(1);
        crypto.getRandomValues(random);
        const j = random[0] % (i + 1);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function makeNewQueue() {
      const previousSong = queue.length ? queue[queue.length - 1] : null;
      queue = shuffle(window.SONG_FILES || []);
      if (queue.length > 1 && queue[0] === previousSong) {
        [queue[0], queue[1]] = [queue[1], queue[0]];
      }
      queuePosition = 0;
    }

    function loadCurrentSong() {
      if (!queue.length) makeNewQueue();
      if (!queue.length) {
        statusText.textContent = "No music files were found";
        return false;
      }
      audio.src = encodeURIComponent(queue[queuePosition]).replace(/%2F/g, "/");
      audio.load();
      songLoaded = true;
      return true;
    }

    async function playMusic() {
      if (!songLoaded && !loadCurrentSong()) return;
      try {
        await audio.play();
        statusText.textContent = "Music is playing";
      } catch (error) {
        statusText.textContent = "Press Play again to begin";
      }
    }

    function pauseMusic() {
      audio.pause();
      statusText.textContent = songLoaded ? "Music is paused" : "Press Play to begin";
    }

    async function nextSong() {
      if (!queue.length) makeNewQueue();
      if (!queue.length) return;
      queuePosition += 1;
      if (queuePosition >= queue.length) makeNewQueue();
      songLoaded = false;
      loadCurrentSong();
      await playMusic();
    }

    playButton.addEventListener("click", playMusic);
    pauseButton.addEventListener("click", pauseMusic);
    skipButton.addEventListener("click", nextSong);
    audio.addEventListener("ended", nextSong);
    audio.addEventListener("error", () => {
      statusText.textContent = "Skipping a song that could not load";
      setTimeout(nextSong, 700);
    });

    makeNewQueue();
  </script>
</body>
</html>
